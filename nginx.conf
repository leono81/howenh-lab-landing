# nginx para el sitio estático (lo copia el Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # comprimido: el HTML pesa ~1 MB por los dibujos en línea y comprimido ~240 KB
    # (text/html se comprime siempre; las woff2 ya vienen comprimidas)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # archivos con hash en el nombre (tipografías y lo que Astro emita): se guardan para siempre
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # la página y lo de public/: cache corta, para que un deploy se vea enseguida
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }
}
